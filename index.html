:root{--navy:#142f40;--teal:#087b70;--paper:#f7f7f2;--line:#dce3df;--muted:#526772;--orange:#ab4937}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font:17px/1.55 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:var(--teal)}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #e3a633;outline-offset:4px}header{background:var(--navy);color:white;padding:22px max(24px,calc((100% - 1200px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:750;font-size:20px;letter-spacing:.01em}.brand span{color:#8fdfcb;margin-right:12px}.header-note{font-size:14px;color:#c7d8dc}main{max-width:1200px;margin:0 auto;padding:38px 24px 64px}.intro{max-width:810px;margin-bottom:28px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--teal);font-size:12px;font-weight:800;margin:0 0 10px}h1{font-size:clamp(30px,4vw,44px);line-height:1.13;letter-spacing:-.035em;margin:0 0 16px}p{margin:0 0 15px}.sub{color:var(--muted);font-size:17px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 8px 32px #142f4005}.qtop{display:flex;justify-content:space-between;gap:16px;font-size:13px;font-weight:700;color:var(--teal);margin-bottom:20px}h2{font-size:24px;line-height:1.35;letter-spacing:-.015em;margin:0 0 23px}fieldset{margin:0;padding:0;border:0;min-width:0}legend{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.options{display:grid;gap:12px}.option{position:relative;display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:background .12s,border-color .12s}.option:hover{background:#f4faf8;border-color:#91bfb6}.option:has(input:checked){background:#eaf7f2;border:2px solid var(--teal);padding:15px 17px}.option input{margin-top:6px;accent-color:var(--teal);width:17px;height:17px;flex-shrink:0}.letter{font-size:13px;font-weight:800;color:var(--muted);padding-top:3px}.option-text{flex:1}.bottom{margin-top:26px;padding-top:23px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.btn{border:1px solid var(--line);border-radius:9px;padding:11px 19px;background:white;font-weight:650;color:var(--navy)}.btn:hover{background:#edf3f0}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.primary:hover{background:#066459}.btn:disabled{opacity:.4;cursor:not-allowed}.aside-title{font-size:16px;margin:0 0 15px}.side{padding:23px}.progress{height:7px;background:#e6ece8;border-radius:9px;overflow:hidden;margin:14px 0 20px}.progress div{height:100%;background:var(--teal);transition:width .2s}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.navq{min-height:42px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--navy);font-weight:650}.navq.done{background:#e0f2e9;color:#086555;border-color:#b6d9ca}.navq[aria-current=true]{outline:2px solid var(--teal);outline-offset:2px}.micro{font-size:13px;color:var(--muted);margin-top:15px}.side .btn{width:100%;margin-top:16px}.error{color:var(--orange);font-size:14px;margin:15px 0 0}details{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}summary{font-weight:650;cursor:pointer}details>div{padding-top:15px;color:var(--muted);font-size:15px}.data{margin:0 0 24px}.data h2{margin-bottom:12px}.data h3{font-size:19px;margin:0 0 12px}.data p{font-size:15px;color:var(--muted)}.tablewrap{overflow-x:auto;margin:15px 0}table{border-collapse:collapse;min-width:620px;width:100%;font-size:13px}caption{text-align:left;font-weight:700;margin-bottom:8px}th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:center;white-space:nowrap}th:first-child{text-align:left}thead{background:#edf2ef}footer{border-top:1px solid var(--line);margin-top:38px;padding-top:20px;display:flex;justify-content:space-between;gap:20px;font-size:13px;color:var(--muted)}.results-head{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.score{font-size:56px;font-weight:800;letter-spacing:-.05em;color:var(--teal)}.score small{font-size:25px;color:var(--muted)}.review{margin:16px 0}.review h3{font-size:19px;margin:0 0 15px}.tag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin-bottom:9px}.tag.wrong{color:var(--orange)}.answer-line{font-size:15px;margin-bottom:9px}.explain{border-top:1px solid var(--line);padding-top:15px;margin-top:15px;color:var(--muted);font-size:16px}.result-actions{display:flex;gap:12px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.aside{order:2}.grid{grid-template-columns:repeat(7,1fr)}header{padding:18px 22px}.header-note{font-size:12px}main{padding-top:27px}.card{padding:23px}.qtop{margin-bottom:15px}h2{font-size:21px}footer{display:block}.score{font-size:48px}}@media(max-width:440px){main{padding-left:16px;padding-right:16px}.card{padding:19px}.option{padding:13px 12px;gap:10px}.option:has(input:checked){padding:12px 11px}.btn{padding:10px 13px}.grid{gap:7px}.bottom{gap:7px}}@media print{header,.intro,.aside,.data,.result-actions,footer{display:none}.card{box-shadow:none;break-inside:avoid}.results-head{display:block}main{padding:0}.review{border-radius:0}}
</style></head><body><header><div class="brand"><span>σ</span><span style="color:#c7d8dc;font-weight:400;margin-left:10px">Statistiques · QCM 5</span></div><div class="header-note">Master 2 NCC</div></header><main><div id="quiz" class="layout"><div><section class="data card" aria-label="Énoncé et données"><h2 id="statement-title" tabindex="-1">Énoncé</h2><p id="case-summary"></p><div id="case-data"></div></section><section id="question-card" class="card" aria-labelledby="question-title"></section></div><aside class="aside"><section class="card side"><h2 class="aside-title">Votre progression</h2><div id="answered" aria-live="polite"></div><div class="progress" role="progressbar" aria-label="Questions répondues" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><div id="bar"></div></div><nav class="grid" id="question-nav" aria-label="Navigation entre les questions"></nav><p class="micro">Vous pouvez passer une question ou choisir « Je ne sais pas ». Une réponse absente vaut 0 point. Vous pouvez modifier vos choix avant l’envoi.</p><button id="finish" class="btn primary">Terminer et envoyer mes réponses</button><p id="message" class="error" role="status"></p></section></aside></div><section id="results" class="hidden" aria-labelledby="results-title"></section></main><script>
const questions=[{"kind": "theory", "question": "Pour comparer le score moyen de deux groupes de personnes distinctes, on utilise, si les conditions sont adaptées :", "options": ["Un test t pour échantillons indépendants.", "Un test t apparié.", "Un test de Friedman.", "Une corrélation de Pearson."], "answer": 0, "explanation": "Un test t pour échantillons indépendants compare deux moyennes de groupes distincts. Le test de Welch permet de ne pas supposer leurs variances égales.", "id": 1, "exercise": 1}, {"kind": "theory", "question": "Dans un test t apparié, l’hypothèse nulle porte sur :", "options": ["L’égalité exacte des scores de chaque personne.", "La normalité de la variable indépendante.", "Une moyenne des différences nulle dans la population.", "Une corrélation nulle entre les deux mesures."], "answer": 2, "explanation": "Le test t apparié analyse les différences individuelles entre les deux conditions. H₀ indique que leur moyenne dans la population est nulle.", "id": 2, "exercise": 2}, {"kind": "theory", "question": "Une ANOVA à un facteur significative pour trois groupes indépendants indique que :", "options": ["Toutes les moyennes diffèrent deux à deux.", "Au moins une moyenne de population diffère des autres.", "Les trois variances sont différentes.", "Le facteur est nécessairement la cause des différences observées."], "answer": 1, "explanation": "L’ANOVA teste l’égalité de toutes les moyennes. Un résultat significatif rejette cette égalité globale sans identifier les paires qui diffèrent.", "id": 3, "exercise": 3}, {"kind": "theory", "question": "Pour comparer deux conditions mesurées chez les mêmes personnes avec un test fondé sur les rangs des différences, on utilise :", "options": ["Mann–Whitney.", "Kruskal–Wallis.", "Friedman.", "Wilcoxon pour échantillons appariés."], "answer": 3, "explanation": "Le test de Wilcoxon des rangs signés utilise le signe et le rang de la valeur absolue des différences appariées.", "id": 4, "exercise": 4}, {"kind": "theory", "question": "Le test de Mann–Whitney convient à la comparaison de :", "options": ["Deux groupes indépendants.", "Deux mesures appariées.", "Trois mesures répétées.", "Une moyenne avec une constante, sans autre échantillon."], "answer": 0, "explanation": "Mann–Whitney compare deux groupes indépendants à partir des rangs des observations réunies.", "id": 5, "exercise": 5}, {"kind": "theory", "question": "Le test de Friedman est adapté à :", "options": ["Deux groupes indépendants.", "Une corrélation entre deux variables quantitatives.", "Au moins trois conditions mesurées chez les mêmes personnes.", "Une comparaison de variances entre groupes indépendants."], "answer": 2, "explanation": "Friedman compare les rangs des conditions à l’intérieur de chaque personne. Il est adapté aux mesures répétées.", "id": 6, "exercise": 6}, {"kind": "theory", "question": "Le test de Kruskal–Wallis est adapté à :", "options": ["Trois mesures répétées chez les mêmes personnes.", "Au moins trois groupes indépendants.", "Deux variables quantitatives dont on cherche la corrélation.", "Deux mesures appariées uniquement."], "answer": 1, "explanation": "Kruskal–Wallis compare plusieurs groupes indépendants à partir des rangs calculés sur l’ensemble des observations.", "id": 7, "exercise": 7}, {"kind": "theory", "question": "Dans la régression linéaire Ŷ = a + bX, la pente b représente :", "options": ["La moyenne de X.", "La proportion de variance expliquée.", "La valeur prédite quand X vaut zéro.", "La variation prédite de Y pour une augmentation de X d’une unité."], "answer": 3, "explanation": "La pente exprime la variation de la prédiction de Y par unité de X. Elle dépend des unités des variables.", "id": 8, "exercise": 8}, {"kind": "theory", "question": "Dans une régression linéaire simple avec constante, R² représente :", "options": ["La proportion de variabilité de Y expliquée par le modèle dans l’échantillon.", "La probabilité que l’hypothèse nulle soit vraie.", "Le signe de la relation entre X et Y.", "La proportion de participants dont le score est prédit exactement."], "answer": 0, "explanation": "R² = 1 − SC résiduelle / SC totale. En régression linéaire simple avec constante, R² est égal au carré de la corrélation de Pearson.", "id": 9, "exercise": 9}, {"kind": "theory", "question": "Un test non paramétrique :", "options": ["Est toujours plus puissant qu’un test paramétrique.", "Ne repose sur aucune condition d’application.", "Peut utiliser les rangs, mais doit respecter le plan et ses propres hypothèses.", "Transforme automatiquement des mesures appariées en groupes indépendants."], "answer": 2, "explanation": "Les tests non paramétriques conservent des conditions d’application, notamment sur l’indépendance ou l’appariement. Ils ne testent pas nécessairement la même hypothèse qu’un test de moyennes.", "id": 10, "exercise": 10}, {"kind": "exercise", "question": "Quelle est la valeur de t pour comparer ces deux moyennes, en calculant groupe 1 moins groupe 2 ?", "options": ["0,75.", "3,00.", "6,00.", "12,00."], "answer": 1, "explanation": "t = (M₁ − M₂) / erreur standard = (28 − 22) / 2 = 3. Avec la formule de Welch, l’erreur standard est √(36/18 + 36/18) = 2.", "statement": "Deux groupes indépendants de 18 personnes passent une épreuve d’attention. Le groupe 1 obtient M₁ = 28 et le groupe 2 M₂ = 22. Dans chaque groupe, l’écart-type vaut 6. L’erreur standard de la différence vaut donc 2. Les conditions du test t sont considérées comme satisfaites.", "id": 11, "exercise": 11}, {"kind": "exercise", "question": "Quelle est la valeur du test t apparié ?", "options": ["0,50.", "1,00.", "4,00.", "2,00."], "answer": 3, "explanation": "L’erreur standard vaut s_d / √n = 5 / √25 = 1. Donc t = moyenne des différences / erreur standard = 2 / 1 = 2, avec 24 degrés de liberté.", "statement": "Chez 25 personnes, on calcule la différence de score de mémoire après entraînement moins avant entraînement. La moyenne des différences vaut 2 points et leur écart-type vaut 5 points. Les conditions du test t apparié sont considérées comme satisfaites.", "id": 12, "exercise": 12}, {"kind": "exercise", "question": "Quel est le rapport F de cette ANOVA ?", "options": ["6,00.", "2,00.", "3,00.", "12,00."], "answer": 0, "explanation": "CM inter = 120 / (3 − 1) = 60. CM intra = 270 / (30 − 3) = 10. Donc F = 60 / 10 = 6, avec 2 et 27 degrés de liberté.", "statement": "Une étude compare les performances exécutives de trois groupes indépendants de 10 personnes. La somme des carrés inter-groupes vaut 120 et la somme des carrés intra-groupes vaut 270. Les conditions de l’ANOVA classique sont considérées comme satisfaites.", "id": 13, "exercise": 13}, {"kind": "exercise", "question": "Quelle part de la variabilité totale les différences entre groupes représentent-elles ?", "options": ["69,2 %.", "44,4 %.", "30,8 %.", "10,0 %."], "answer": 2, "explanation": "η² = SC inter / (SC inter + SC intra) = 120 / (120 + 270) ≈ 0,3077, soit 30,8 %.", "statement": "On reprend l’étude précédente : SC inter-groupes = 120 et SC intra-groupes = 270. On calcule η² = SC inter-groupes / SC totale.", "id": 14, "exercise": 14}, {"kind": "exercise", "question": "Pour Wilcoxon, quelle est la plus petite des deux sommes de rangs signés ?", "options": ["9.", "6.", "15.", "3."], "answer": 1, "explanation": "Les rangs absolus sont 1, 2, 3, 4 et 5. Somme positive = 1 + 3 + 5 = 9. Somme négative = 2 + 4 = 6. La plus petite vaut 6.", "statement": "Cinq personnes passent deux conditions. Leurs différences de score sont +1, −2, +3, −4 et +5. Pour le test de Wilcoxon apparié, on classe les valeurs absolues des différences, puis on additionne séparément les rangs positifs et négatifs. Aucun écart n’est nul et il n’y a pas d’ex æquo.", "id": 15, "exercise": 15}, {"kind": "exercise", "question": "Quelle est la valeur de U₁ selon la formule donnée ?", "options": ["12.", "10.", "6.", "2."], "answer": 3, "explanation": "U₁ = R₁ − n₁(n₁ + 1)/2 = 12 − 4 × 5/2 = 2. L’autre statistique vaut U₂ = n₁n₂ − U₁ = 16 − 2 = 14.", "statement": "Deux groupes indépendants de quatre personnes sont comparés avec Mann–Whitney. Après classement des huit scores, la somme des rangs du groupe 1 vaut R₁ = 12. Utiliser U₁ = R₁ − n₁(n₁ + 1)/2.", "id": 16, "exercise": 16}, {"kind": "exercise", "question": "Quelle décision convient au seuil de 5 % ?", "options": ["Rejeter l’hypothèse nulle globale, sans conclure que toutes les paires diffèrent.", "Conclure que toutes les paires diffèrent.", "Conserver l’hypothèse nulle parce que les mesures sont répétées.", "Conclure que les trois conditions sont équivalentes."], "answer": 0, "explanation": "p = 0,041 < 0,05 : le test global est significatif. Des comparaisons appariées adaptées et corrigées seraient nécessaires pour identifier les conditions qui diffèrent.", "statement": "Les mêmes 20 personnes réalisent trois conditions d’une tâche de mémoire. Un test de Friedman donne une valeur p = 0,041. On utilise un seuil de signification α = 0,05.", "id": 17, "exercise": 17}, {"kind": "exercise", "question": "Quelle est la statistique H de Kruskal–Wallis, sans correction d’ex æquo ?", "options": ["2,4.", "3,6.", "7,2.", "14,4."], "answer": 2, "explanation": "Σ(Rⱼ²/nⱼ) = 6²/3 + 15²/3 + 24²/3 = 12 + 75 + 192 = 279. H = 12 × 279 / (9 × 10) − 3 × 10 = 37,2 − 30 = 7,2.", "statement": "Trois groupes indépendants comprennent chacun 3 personnes. Les sommes de rangs sont 6, 15 et 24, sans ex æquo. L’effectif total vaut N = 9. Utiliser H = [12 / (N(N + 1))] × Σ(Rⱼ²/nⱼ) − 3(N + 1).", "id": 18, "exercise": 18}, {"kind": "exercise", "question": "Quel score est prédit pour une personne âgée de 60 ans ?", "options": ["18.", "20.", "42.", "24."], "answer": 3, "explanation": "Ŷ = 48 − 0,40 × 60 = 48 − 24 = 24 points.", "statement": "Une régression linéaire relie l’âge X, en années, à un score de mémoire Y. La droite estimée est Ŷ = 48 − 0,40X. Les âges observés vont de 40 à 75 ans.", "id": 19, "exercise": 19}, {"kind": "exercise", "question": "Quelle est la valeur de R² ?", "options": ["−64 %.", "64 %.", "80 %.", "36 %."], "answer": 1, "explanation": "Dans une régression simple avec constante, R² = r² = (−0,80)² = 0,64, soit 64 %. Le signe négatif indique le sens de la relation, pas une variance expliquée négative.", "statement": "Dans cette régression linéaire simple avec constante, la corrélation entre âge et score de mémoire vaut r = −0,80.", "id": 20, "exercise": 20}];
let current=0;let answers=Array(questions.length).fill(null);let completed=false;
const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const letter=i=>'ABCD'[i];
function renderQuestion(focus=false){const q=questions[current];$('question-card').innerHTML=`<div class="qtop"><span>QUESTION ${q.id} / 20</span></div><h2 id="question-title" tabindex="-1">${escape(q.question)}</h2><fieldset><legend>Choisissez une seule réponse</legend><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''}><span class="letter">${letter(i)}</span><span class="option-text">${escape(o)}</span></label>`).join('')}</div></fieldset><button type="button" class="btn" id="clear-answer" style="margin-top:16px">Je ne sais pas / laisser sans réponse</button><div class="bottom"><button class="btn" id="prev" ${current===0?'disabled':''}>Précédente</button><button class="btn primary" id="next">${current===19?'Voir ma progression':'Question suivante'}</button></div>`;
$('question-card').querySelectorAll('input').forEach(r=>r.addEventListener('change',()=>{answers[current]=Number(r.value);$('message').textContent='';renderProgress();}));$('clear-answer').onclick=()=>{answers[current]=null;renderQuestion(true);};$('prev').onclick=()=>go(current-1);$('next').onclick=()=>{if(current<19)go(current+1);else{$('finish').scrollIntoView({behavior:'smooth',block:'center'});$('finish').focus();}};renderProgress();const dataPanel=document.querySelector('.data');dataPanel.classList.toggle('hidden',!q.statement);$('case-summary').textContent='';$('case-data').innerHTML=q.statement?`<p>${escape(q.statement)}</p>`:'';if(focus)$('question-title').focus({preventScroll:true});}
function renderProgress(){let n=answers.filter(a=>a!==null).length;$('answered').textContent=`${n} réponse${n>1?'s':''} sur 20`;$('bar').style.width=`${n/20*100}%`;document.querySelector('.progress').setAttribute('aria-valuenow',n);$('question-nav').innerHTML=questions.map((q,i)=>`<button class="navq ${answers[i]!==null?'done':''}" aria-current="${i===current}" aria-label="Question ${i+1}, ${answers[i]!==null?'répondue':'sans réponse'}" data-q="${i}">${i+1}</button>`).join('');$('question-nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(Number(b.dataset.q)));}
function go(i){if(i<0||i>=20||completed)return;const changed=questions[i].exercise!==questions[current].exercise;current=i;renderQuestion(!changed);if(changed&&questions[current].statement){$('statement-title').focus({preventScroll:true});$('statement-title').scrollIntoView({behavior:'smooth',block:'start'});}else{$('question-card').scrollIntoView({behavior:'smooth',block:'start'});}}
$('finish').onclick=()=>{completed=true;const score=answers.filter((a,i)=>a===questions[i].answer).length;$('quiz').classList.add('hidden');$('results').classList.remove('hidden');$('results').innerHTML=`<div class="card results-head"><div class="score">${score}<small> / 20</small></div><div><p class="eyebrow">Votre résultat</p><h2 id="results-title" tabindex="-1">${score===20?'Toutes les réponses sont correctes.':'Le corrigé pour comprendre vos réponses.'}</h2><p class="sub">${score} bonne${score>1?'s':''} réponse${score>1?'s':''} · ${Math.round(score/20*100)} % de réussite.</p><div class="result-actions"><button class="btn primary" id="retry">Recommencer le QCM</button><button class="btn" id="print">Imprimer le corrigé</button></div></div></div>${questions.map((q,i)=>`<article class="card review"><p class="tag ${answers[i]===q.answer?'':'wrong'}">Question ${q.id} · ${answers[i]===null?'Sans réponse':answers[i]===q.answer?'Bonne réponse':'À revoir'}</p><h3>${escape(q.question)}</h3><p class="answer-line">${answers[i]===null?'<strong>Vous avez laissé cette question sans réponse.</strong>':`<strong>Votre réponse ${letter(answers[i])} :</strong> ${escape(q.options[answers[i]])}`}</p>${answers[i]!==q.answer?`<p class="answer-line"><strong>Bonne réponse ${letter(q.answer)} :</strong> ${escape(q.options[q.answer])}</p>`:''}<p class="explain">${escape(q.explanation)}</p></article>`).join('')}`;$('retry').onclick=()=>{answers=Array(20).fill(null);current=0;completed=false;$('results').classList.add('hidden');$('quiz').classList.remove('hidden');$('message').textContent='';renderQuestion(true);window.scrollTo({top:0,behavior:'smooth'});};$('print').onclick=()=>window.print();$('results-title').focus();window.scrollTo({top:0,behavior:'smooth'});};renderQuestion();
</script><script>window.QCM_RESULTS_ENDPOINT="https://script.google.com/macros/s/AKfycbxxBUVfyHRBsVf62bA85YS2ykNneWUYAQp3bptzkI8snQRos3BcQqgDmh1Kvv2aCD_9/exec";
/* Suivi facultatif des tentatives, indépendant de l’hébergeur du QCM. */
(() => {
  const endpoint = window.QCM_RESULTS_ENDPOINT;
  if (!endpoint) return;
  let startedAt;
  let studentAlias = '';
  const quizPanel = document.getElementById('quiz');
  const welcome = document.createElement('section');
  welcome.className = 'card';
  welcome.id = 'welcome';
  welcome.innerHTML = `<h2>Avant de commencer</h2><p>Saisissez votre prénom et l'initiale de votre nom</p>
    <form id="start-form"><label for="start-alias">Votre nom</label><br><input id="start-alias" required minlength="2" maxlength="60" autocomplete="off" style="width:100%;max-width:360px;padding:12px;margin:12px 0;border:1px solid var(--line);border-radius:8px">
    
    <button class="btn primary" type="submit">Commencer le QCM</button><p id="start-error" role="status"></p></form>`;
  quizPanel.before(welcome);
  quizPanel.classList.add('hidden');
  welcome.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    const input = document.getElementById('start-alias');
    studentAlias = input.value.trim();
    if (studentAlias.length < 2 || /[\x00-\x1f\x7f]/.test(studentAlias)) { document.getElementById('start-error').textContent = 'Saisissez un nom valide (2 à 60 caractères).'; return; }
    startedAt = new Date().toISOString();
    welcome.classList.add('hidden');
    quizPanel.classList.remove('hidden');
    document.getElementById('question-title').focus({preventScroll:true});
    window.scrollTo({top:0,behavior:'smooth'});
  });
  const finish = document.getElementById('finish');
  finish.addEventListener('click', () => {
    if (!completed) return;
    const attempt = {
      version: 1,
      quizId: 'qcm5-v1',
      attemptId: crypto.randomUUID(),
      startedAt,
      finishedAt: new Date().toISOString(),
      answers: answers.map((value, index) => ({questionId: questions[index].id, answer: value})),
    };
    const section = document.createElement('section');
    section.className = 'card';
    section.setAttribute('aria-labelledby', 'tracking-title');
    section.innerHTML = `<h2 id="tracking-title">Envoyer mes réponses pour voir ma note</h2>
      <p>Pour suivre votre progression, utilisez le même nom à chaque tentative. </p>
      <form id="tracking-form"><label for="student-alias">Votre nom</label><br>
      <input id="student-alias" name="alias" type="text" required minlength="2" maxlength="60" autocomplete="off" style="width:100%;max-width:360px;padding:10px;margin:10px 0;border:1px solid var(--line);border-radius:8px">
      <div><button class="btn primary" type="submit">Envoyer mon résultat</button></div>
      <p id="tracking-status" role="status" aria-live="polite" style="margin-top:12px"></p></form>`;
    const resultPanel = document.getElementById('results');
    const correction = document.createElement('div');
    correction.className = 'hidden';
    correction.id = 'correction';
    while(resultPanel.firstChild) correction.appendChild(resultPanel.firstChild);
    resultPanel.append(section, correction);
    resultPanel.setAttribute('aria-labelledby', 'tracking-title');
    const omitted = answers.filter(a => a === null).length;
    const summary = document.createElement('p');
    summary.textContent = `${answers.length - omitted} réponse(s) renseignée(s), ${omitted} question(s) sans réponse. La note et le corrigé apparaîtront après l’envoi.`;
    section.querySelector('h2').after(summary);
    section.style.marginBottom = "24px";
    const form = section.querySelector('form');
    const status = section.querySelector('#tracking-status');
    const alias = section.querySelector('input');
    const button = section.querySelector('button');
    alias.value = studentAlias;
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      if (alias.value.trim().length < 2) { status.textContent = 'Saisissez un nom d’au moins deux caractères.'; return; }
      button.disabled = true;
      alias.disabled = true;
      status.textContent = 'Envoi en cours…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000);
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=UTF-8'},
          body: JSON.stringify({...attempt, alias: alias.value.trim()}),
          signal: controller.signal,
          credentials: 'omit',
        });
        if (!response.ok) throw new Error('HTTP');
        const result = await response.json();
        if (result.ok !== true || result.attemptId !== attempt.attemptId) throw new Error('Unconfirmed');
        status.textContent = 'Votre résultat a bien été enregistré. Vous pouvez consulter le corrigé ci-dessous.';
        button.textContent = 'Résultat envoyé';
        correction.classList.remove('hidden');
        resultPanel.setAttribute('aria-labelledby', 'results-title');
        document.getElementById('results-title').focus();
      } catch (_) {
        status.textContent = 'L’enregistrement n’a pas pu être confirmé. La note et le corrigé restent masqués. Vous pouvez réessayer : cette tentative ne sera pas comptée deux fois.';
        button.disabled = false;
        alias.disabled = false;
        button.textContent = 'Réessayer l’envoi';
      } finally { clearTimeout(timeout); }
    });
    document.getElementById('tracking-title').setAttribute('tabindex', '-1');
    document.getElementById('tracking-title').focus();
    document.getElementById('retry').addEventListener('click', () => {
      quizPanel.classList.add('hidden');
      welcome.classList.remove('hidden');
      document.getElementById('start-alias').value = studentAlias;
      document.getElementById('start-alias').focus();
    });
  });
})();
</script></body></html>
